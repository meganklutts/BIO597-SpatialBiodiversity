<text x="165" y="445" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#18212b" text-anchor="middle">0 alternate copies</text>
<text x="490" y="55" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="700" fill="#18212b" text-anchor="middle">0/1</text>
<rect x="441" y="100" width="28" height="125" rx="14" fill="#e6eeed" stroke="#ccd3d7" stroke-width="2"/>
