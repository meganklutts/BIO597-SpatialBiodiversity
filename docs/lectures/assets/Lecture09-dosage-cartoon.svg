<circle cx="490" cy="350" r="44" fill="#969696" stroke="#18212b" stroke-width="3"/>
<text x="490" y="360" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700" fill="#18212b" text-anchor="middle">1</text>
