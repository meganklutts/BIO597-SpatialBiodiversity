<circle cx="130" cy="162" r="22" fill="white" stroke="#18212b" stroke-width="2"/>
<text x="130" y="170" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" fill="#18212b" text-anchor="middle">R</text>
