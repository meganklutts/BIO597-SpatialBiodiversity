<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 500" role="img" aria-labelledby="title">
<title id="title">A retained SNP with OOB R squared 0.40 allocates 0.30 to temperature and 0.10 to rainfall; predictor allocations are averaged across SNPs.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<text x="90" y="45" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#18212b" text-anchor="start">One retained SNP</text>
<text x="91" y="116" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#087e8b" text-anchor="start">OOB R² = 0.40</text>
<rect x="90" y="150" width="600" height="78" rx="3" fill="#087e8b" stroke="none" stroke-width="2"/>
<rect x="540" y="150" width="150" height="78" rx="0" fill="#d95d39" stroke="none" stroke-width="2"/>
<text x="315" y="200" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="white" text-anchor="middle">0.30</text>
<text x="615" y="200" font-family="Arial, Helvetica, sans-serif" font-size="35" font-weight="700" fill="white" text-anchor="middle">0.10</text>
<text x="315" y="268" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#087e8b" text-anchor="middle">Temperature</text>
<text x="615" y="268" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#d95d39" text-anchor="middle">Rainfall</text>
<text x="390" y="328" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="middle">3:1 share of positive permutation importance</text>
<line x1="745" y1="190" x2="832" y2="190" stroke="#087e8b" stroke-width="4" marker-end="url(#arrow)"/>
<text x="1030" y="68" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18212b" text-anchor="middle">Repeat for every</text>
<text x="1030" y="104" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#18212b" text-anchor="middle">contributing SNP</text>
<rect x="900" y="157" width="210.0" height="32" rx="0" fill="#087e8b" stroke="none" stroke-width="2"/>
<rect x="1110.0" y="157" width="70.0" height="32" rx="0" fill="#d95d39" stroke="none" stroke-width="2"/>
<rect x="900" y="221" width="35.0" height="32" rx="0" fill="#087e8b" stroke="none" stroke-width="2"/>
<rect x="935.0" y="221" width="105.0" height="32" rx="0" fill="#d95d39" stroke="none" stroke-width="2"/>
<rect x="900" y="285" width="140.0" height="32" rx="0" fill="#087e8b" stroke="none" stroke-width="2"/>
<rect x="1040.0" y="285" width="70.0" height="32" rx="0" fill="#d95d39" stroke="none" stroke-width="2"/>
<line x1="1030" y1="360" x2="1030" y2="405" stroke="#087e8b" stroke-width="3" marker-end="url(#arrow)"/>
<text x="1030" y="453" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#087e8b" text-anchor="middle">Average by predictor</text>
</svg>
