<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1296 500" role="img" aria-labelledby="title">
<title id="title">An enlarged schematic PCA biplot with neighboring sample scores and environmental arrows.</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"/></marker></defs>
<line x1="250" y1="286" x2="1015" y2="286" stroke="#ccd3d7" stroke-width="2"/>
<line x1="570" y1="465" x2="570" y2="80" stroke="#ccd3d7" stroke-width="2"/>
<text x="1026" y="292" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="start">PC1</text>
<text x="570" y="58" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="middle">PC2</text>
<circle cx="330" cy="345" r="14" fill="#5364a3" stroke="white" stroke-width="2"/>
<circle cx="350" cy="362" r="14" fill="#5364a3" stroke="white" stroke-width="2"/>
<circle cx="378" cy="337" r="14" fill="#607ea5" stroke="white" stroke-width="2"/>
<circle cx="448" cy="316" r="14" fill="#538fa1" stroke="white" stroke-width="2"/>
<circle cx="610" cy="240" r="14" fill="#819e66" stroke="white" stroke-width="2"/>
<circle cx="743" cy="207" r="14" fill="#b3ad51" stroke="white" stroke-width="2"/>
<circle cx="790" cy="189" r="14" fill="#b3ad51" stroke="white" stroke-width="2"/>
<circle cx="853" cy="251" r="14" fill="#c98a62" stroke="white" stroke-width="2"/>
<circle cx="913" cy="242" r="14" fill="#c98a62" stroke="white" stroke-width="2"/>
<line x1="570" y1="286" x2="874" y2="137" stroke="#087e8b" stroke-width="5" marker-end="url(#arrow)"/>
<text x="888" y="127" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#087e8b" text-anchor="start">Temperature</text>
<line x1="570" y1="286" x2="706" y2="391" stroke="#d95d39" stroke-width="5" marker-end="url(#arrow)"/>
<text x="725" y="412" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#d95d39" text-anchor="start">Rainfall</text>
<text x="54" y="124" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#18212b" text-anchor="start">Nearby points:</text>
<text x="54" y="160" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="start">similar PC1/2 scores</text>
<line x1="252" y1="175" x2="352" y2="321" stroke="#52606d" stroke-width="2" marker-end="url(#arrow)"/>
<text x="900" y="345" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#18212b" text-anchor="start">Arrow direction:</text>
<text x="900" y="382" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="start">increasing values</text>
<text x="900" y="454" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="start">Length: contribution</text>
<text x="900" y="485" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#52606d" text-anchor="start">to these two axes</text>
</svg>
